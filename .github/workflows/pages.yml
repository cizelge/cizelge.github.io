# master'a her gönderimde siteyi statik olarak derler ve GitHub Pages'e yayınlar.
name: GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Statik site
        run: npm run build:pages
        env:
          SITE_URL: https://cizelge.github.io
          # Oy servisi (Deno Deploy). Depo ayarlarındaki "RATINGS_API" değişkeni varsa o kullanılır.
          NEXT_PUBLIC_RATINGS_API: ${{ vars.RATINGS_API || 'https://oylar.cizelge-oy.deno.net' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
